<!-- Step 11: string interpolation -->
<h1>{{ portalName }}</h1>
<p>Browse your courses, track enrollment, and check your grades — all in one place.</p>

<div class="stats-row">
  <div class="stat-card">
    <span class="stat-value">{{ coursesAvailable }}</span>
    <span class="stat-label">Courses Available</span>
  </div>
  <div class="stat-card">
    <span class="stat-value">3</span>
    <span class="stat-label">Enrolled</span>
  </div>
  <div class="stat-card">
    <span class="stat-value">3.8</span>
    <span class="stat-label">GPA</span>
  </div>
</div>

<section class="binding-demo">
  <!-- Step 12: property binding -->
  <button [disabled]="!isPortalActive" (click)="onEnrollClick()">Enroll Now</button>
  <p *ngIf="message">{{ message }}</p>

  <!-- Step 14: two-way binding -->
  <label for="search">Search courses</label>
  <input id="search" [(ngModel)]="searchTerm" placeholder="e.g. Angular" />
  <p>Searching for: {{ searchTerm }}</p>
</section>

<!-- Step 62: injects the same CourseService singleton — click "Add Sample
     Course" here, then visit /courses and see the new course listed there too. -->
<app-course-summary-widget></app-course-summary-widget>
