<div *ngIf="course; else notFound">
  <h2>{{ course.name }}</h2>
  <p>Code: {{ course.code }}</p>
  <p>Credits: {{ course.credits }}</p>
  <p>Status: {{ course.gradeStatus }}</p>

  <h3>Enrolled Students</h3>
  <ul *ngIf="enrolledStudents.length > 0; else noStudents">
    <li *ngFor="let student of enrolledStudents">{{ student.name }}</li>
  </ul>
  <ng-template #noStudents>
    <p>No students enrolled in this course yet.</p>
  </ng-template>

  <a routerLink="/courses">&larr; Back to courses</a>
</div>
<ng-template #notFound>
  <p>No course found with that ID.</p>
  <a routerLink="/courses">&larr; Back to courses</a>
</ng-template>
