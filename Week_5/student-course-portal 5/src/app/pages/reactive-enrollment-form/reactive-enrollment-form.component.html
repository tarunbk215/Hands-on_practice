<h2>Enrollment Request (Reactive Form)</h2>

<form [formGroup]="enrollForm" (ngSubmit)="onSubmit()">

  <div class="field">
    <label for="studentName">Student Name</label>
    <input id="studentName" type="text" formControlName="studentName" />
    <div class="errors" *ngIf="enrollForm.get('studentName')?.touched && enrollForm.get('studentName')?.invalid">
      <span *ngIf="enrollForm.get('studentName')?.errors?.['required']">Name is required.</span>
      <span *ngIf="enrollForm.get('studentName')?.errors?.['minlength']">Name must be at least 3 characters.</span>
    </div>
  </div>

  <div class="field">
    <label for="courseId">Course ID</label>
    <input id="courseId" type="text" formControlName="courseId" placeholder="e.g. CS101" />
    <!-- Step 54 -->
    <div class="errors" *ngIf="enrollForm.get('courseId')?.touched && enrollForm.get('courseId')?.invalid">
      <span *ngIf="enrollForm.get('courseId')?.errors?.['required']">Course ID is required.</span>
      <span *ngIf="enrollForm.get('courseId')?.errors?.['noCourseCode']">Course code starting with XX is not allowed.</span>
    </div>
  </div>

  <div class="field">
    <label for="studentEmail">Student Email</label>
    <input id="studentEmail" type="email" formControlName="studentEmail" />
    <div class="hint" *ngIf="enrollForm.get('studentEmail')?.pending">Checking email availability...</div>
    <div class="errors" *ngIf="enrollForm.get('studentEmail')?.touched && enrollForm.get('studentEmail')?.invalid">
      <span *ngIf="enrollForm.get('studentEmail')?.errors?.['required']">Email is required.</span>
      <span *ngIf="enrollForm.get('studentEmail')?.errors?.['email']">Enter a valid email address.</span>
      <span *ngIf="enrollForm.get('studentEmail')?.errors?.['emailTaken']">This email is already taken.</span>
    </div>
  </div>

  <div class="field">
    <label for="preferredSemester">Preferred Semester</label>
    <select id="preferredSemester" formControlName="preferredSemester">
      <option value="Odd">Odd</option>
      <option value="Even">Even</option>
    </select>
  </div>

  <div class="field field--checkbox">
    <input id="agreeToTerms" type="checkbox" formControlName="agreeToTerms" />
    <label for="agreeToTerms">I agree to the terms and conditions</label>
  </div>

  <!-- Step 56: FormArray -->
  <div class="field">
    <label>Additional Courses</label>
    <div class="additional-course-row" *ngFor="let ctrl of additionalCourses.controls; let i = index">
      <input [formControl]="$any(ctrl)" placeholder="e.g. CS204" />
      <button type="button" (click)="removeCourse(i)">Remove</button>
    </div>
    <button type="button" (click)="addCourse()">Add Another Course</button>
  </div>

  <div class="form-actions">
    <button type="submit" [disabled]="enrollForm.invalid || enrollForm.pending">Submit</button>
  </div>
</form>
