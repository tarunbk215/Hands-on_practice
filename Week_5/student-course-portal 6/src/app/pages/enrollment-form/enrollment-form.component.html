<h2>Enrollment Request (Template-Driven Form)</h2>

<form #enrollForm="ngForm" (ngSubmit)="onSubmit(enrollForm)">

  <!-- Student Name -->
  <div class="field">
    <label for="studentName">Student Name</label>
    <input
      id="studentName"
      name="studentName"
      type="text"
      [(ngModel)]="studentName"
      #nameCtrl="ngModel"
      required
      minlength="3"
    />
    <div class="errors" *ngIf="nameCtrl.touched && nameCtrl.invalid">
      <span *ngIf="nameCtrl.errors?.['required']">Name is required.</span>
      <span *ngIf="nameCtrl.errors?.['minlength']">Name must be at least 3 characters.</span>
    </div>
  </div>

  <!-- Student Email -->
  <div class="field">
    <label for="studentEmail">Student Email</label>
    <input
      id="studentEmail"
      name="studentEmail"
      type="email"
      [(ngModel)]="studentEmail"
      #emailCtrl="ngModel"
      required
      email
    />
    <div class="errors" *ngIf="emailCtrl.touched && emailCtrl.invalid">
      <span *ngIf="emailCtrl.errors?.['required']">Email is required.</span>
      <span *ngIf="emailCtrl.errors?.['email']">Enter a valid email address.</span>
    </div>
  </div>

  <!-- Course ID -->
  <div class="field">
    <label for="courseId">Course ID</label>
    <input
      id="courseId"
      name="courseId"
      type="number"
      [(ngModel)]="courseId"
      #courseIdCtrl="ngModel"
      required
    />
    <div class="errors" *ngIf="courseIdCtrl.touched && courseIdCtrl.invalid">
      <span *ngIf="courseIdCtrl.errors?.['required']">Course ID is required.</span>
    </div>
  </div>

  <!-- Preferred Semester -->
  <div class="field">
    <label for="preferredSemester">Preferred Semester</label>
    <select id="preferredSemester" name="preferredSemester" [(ngModel)]="preferredSemester">
      <option value="Odd">Odd</option>
      <option value="Even">Even</option>
    </select>
  </div>

  <!-- Agree to Terms -->
  <div class="field field--checkbox">
    <input
      id="agreeToTerms"
      name="agreeToTerms"
      type="checkbox"
      [(ngModel)]="agreeToTerms"
      #agreeCtrl="ngModel"
      required
    />
    <label for="agreeToTerms">I agree to the terms and conditions</label>
    <div class="errors" *ngIf="agreeCtrl.touched && agreeCtrl.invalid">
      <span>You must agree to the terms to enroll.</span>
    </div>
  </div>

  <div class="form-actions">
    <button type="submit" [disabled]="enrollForm.invalid">Submit</button>
    <button type="button" (click)="enrollForm.resetForm(); onReset()">Reset</button>
  </div>

  <div class="success-message" *ngIf="submitted">
    Enrollment request submitted successfully!
  </div>
</form>
